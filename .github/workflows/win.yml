name: Windows.

on:
  workflow_dispatch:
  push:
    branches:
      - customgram-dev
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
      - '.github/workflows/win.yml'
  pull_request:
    branches:
      - customgram-dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest

    strategy:
      matrix:
        arch: [x64]
        qt: [""]
        generator: [""]

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd
    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries${{ matrix.arch == 'x64' && '\win64' || '' }}>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: TBuild/${{ github.event.repository.name }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV
          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Install VS 2026 Build Tools.
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri https://aka.ms/vs/18/stable/vs_buildtools.exe -OutFile $exe
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
            '--quiet','--wait','--norestart','--nocache', `
            '--add','Microsoft.VisualStudio.Workload.VCTools', `
            '--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64', `
            '--add','Microsoft.VisualStudio.Component.VC.ATL.ARM64'
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: ${{ case(matrix.arch == 'arm64', '', '14.44') }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent ${{ matrix.qt }}

      - name: Read configuration matrix.
        shell: bash
        run: |
          ARTIFACT_NAME="Customgram"
          ARCH=""
          if [ -n "${{ matrix.arch }}" ]; then
            case "${{ matrix.arch }}" in
              x64_x86) ARCH="x86";;
              arm64) ARCH="arm";;
              *) ARCH="${{ matrix.arch }}";;
            esac
            echo "Architecture from matrix: $ARCH"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.arch }}"
          fi

          if [ -n "${{ matrix.qt }}" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.qt }}"
          fi
          GENERATOR=""
          if [ -n "${{ matrix.generator }}" ]; then
            GENERATOR="-G \"${{ matrix.generator }}\""
            echo "Generator from matrix: $GENERATOR"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.generator }}"
          fi
          echo "TDESKTOP_BUILD_GENERATOR=$GENERATOR" >> $GITHUB_ENV

          [ -n "$GENERATOR" ] && ARCH=""
          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> $GITHUB_ENV
          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo "Define from matrix: $DEFINE"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.defines }}"
          fi
          echo "TDESKTOP_BUILD_DEFINE=$DEFINE" >> $GITHUB_ENV

          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
          API="-D TDESKTOP_API_TEST=ON"
          if [ $GITHUB_REF == 'refs/heads/nightly' ]; then
            echo "Use the open credentials."
            API="-D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c"
          fi
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.cpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Customgram build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          ${{ matrix.qt }} ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF ^
          %TDESKTOP_BUILD_DEFINE%

          cmake --build ..\out --config Release --parallel

      - name: Stage Customgram and compile custom updater.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        shell: pwsh
        run: |
          $repo = Join-Path $env:TBUILD $env:REPO_NAME
          $out = Join-Path $repo 'out\Release'
          $dist = Join-Path $repo 'dist'
          $artifact = Join-Path $env:GITHUB_WORKSPACE 'artifact'

          New-Item -ItemType Directory -Force -Path $artifact | Out-Null

          $app = Join-Path $out 'Customgram.exe'
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) {
            throw "Build output not found: $app"
          }
          Copy-Item -LiteralPath $app -Destination (Join-Path $artifact 'Customgram.exe') -Force

          $modules = Join-Path $out 'modules'
          if (-not (Test-Path -LiteralPath $modules -PathType Container)) {
            throw "Build modules directory not found: $modules"
          }
          $artifactModules = Join-Path $artifact 'modules'
          New-Item -ItemType Directory -Force -Path $artifactModules | Out-Null
          Copy-Item -Path (Join-Path $modules '*') -Destination $artifactModules -Recurse -Force

          $cscCandidates = @(
            (Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'),
            (Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe')
          )
          $csc = $cscCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $csc) { throw '.NET Framework C# compiler (csc.exe) was not found.' }

          $updaterSource = Join-Path $dist 'Updater.cs'
          $updaterIcon = Join-Path $dist 'Customgram.ico'
          if (-not (Test-Path $updaterSource) -or -not (Test-Path $updaterIcon)) {
            throw 'dist\Updater.cs or dist\Customgram.ico is missing.'
          }

          $updaterOutput = Join-Path $artifact 'Updater.exe'
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ `
            "/win32icon:$updaterIcon" "/out:$updaterOutput" `
            /reference:System.dll `
            /reference:System.Windows.Forms.dll `
            /reference:System.IO.Compression.dll `
            /reference:System.IO.Compression.FileSystem.dll `
            /reference:System.Web.Extensions.dll `
            $updaterSource
          if ($LASTEXITCODE -ne 0) { throw "Custom updater compilation failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path -LiteralPath $updaterOutput -PathType Leaf)) {
            throw 'Custom updater compilation did not produce Updater.exe.'
          }

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact\
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the latest successful branch build
        id: find-build
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'win.yml',
              branch: 'customgram-dev',
              status: 'completed',
              per_page: 100
            });
            const runs = response.data.workflow_runs
              .filter(run => run.event === 'push'
                && run.head_branch === 'customgram-dev'
                && run.conclusion === 'success')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            let selected = null;
            for (const run of runs) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100
              });
              if (artifacts.data.artifacts.some(a => a.name === 'Customgram x64' && !a.expired)) {
                selected = run;
                break;
              }
            }
            if (!selected) {
              core.setFailed('No successful Customgram x64 branch build artifact was found. Push customgram-dev and wait for its build to succeed before tagging.');
            } else {
              core.setOutput('run_id', String(selected.id));
              core.setOutput('head_sha', selected.head_sha);
              core.info(`Using branch build ${selected.id} from ${selected.head_sha}`);
            }

      - name: Verify that only the workflow changed after the compiled commit
        shell: pwsh
        env:
          BUILD_SHA: ${{ steps.find-build.outputs.head_sha }}
        run: |
          if (-not $env:BUILD_SHA) { throw 'No successful build SHA was found.' }
          git merge-base --is-ancestor $env:BUILD_SHA $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw 'The available build is not from an ancestor of this tag. Push the source commit to customgram-dev and wait for a successful build.'
          }
          git diff --quiet $env:BUILD_SHA $env:GITHUB_SHA -- . ':(exclude).github/workflows/win.yml'
          $diffExit = $LASTEXITCODE
          if ($diffExit -eq 1) {
            throw 'Source files changed after the available build. Push customgram-dev and wait for a successful build before creating the tag.'
          }
          if ($diffExit -gt 1) { throw "git diff failed with exit code $diffExit." }

      - name: Download build artifact from the branch run
        uses: actions/download-artifact@v7
        with:
          name: Customgram x64
          path: artifact
          run-id: ${{ steps.find-build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore FFmpeg from the previous Customgram release
        shell: pwsh
        run: |
          $apiUrl = 'https://api.github.com/repos/JornyZipper/Customgram/releases/tags/V13.0.5'
          $headers = @{ 'User-Agent' = 'Customgram-Release-Builder/1.0'; 'Accept' = 'application/vnd.github+json' }
          $release = Invoke-RestMethod -Uri $apiUrl -Headers $headers
          $zipAsset = $release.assets | Where-Object { $_.name -eq 'Customgram-Windows.zip' } | Select-Object -First 1
          $hashAsset = $release.assets | Where-Object { $_.name -eq 'Customgram-Windows.zip.sha256' } | Select-Object -First 1
          if (-not $zipAsset -or -not $hashAsset) { throw 'The V13.0.5 release is missing the updater ZIP or SHA-256 asset.' }

          $oldZip = Join-Path $env:RUNNER_TEMP 'Customgram-Windows-V13.0.5.zip'
          $oldHash = Join-Path $env:RUNNER_TEMP 'Customgram-Windows-V13.0.5.zip.sha256'
          Invoke-WebRequest -Uri $zipAsset.browser_download_url -Headers $headers -OutFile $oldZip
          Invoke-WebRequest -Uri $hashAsset.browser_download_url -Headers $headers -OutFile $oldHash

          $hashMatch = [regex]::Match((Get-Content -LiteralPath $oldHash -Raw), '\b[A-Fa-f0-9]{64}\b')
          if (-not $hashMatch.Success) { throw 'The previous release SHA-256 file is malformed.' }
          $actualHash = (Get-FileHash -LiteralPath $oldZip -Algorithm SHA256).Hash
          if (-not $actualHash.Equals($hashMatch.Value, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'The previous release ZIP failed SHA-256 verification.'
          }

          $extract = Join-Path $env:RUNNER_TEMP 'Customgram-V13.0.5-extracted'
          if (Test-Path $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
          Expand-Archive -LiteralPath $oldZip -DestinationPath $extract -Force
          $ffmpeg = Join-Path $extract 'modules\ffmpeg.exe'
          if (-not (Test-Path -LiteralPath $ffmpeg -PathType Leaf)) {
            throw 'modules\ffmpeg.exe was not found inside the V13.0.5 release ZIP.'
          }

          $artifactModules = Join-Path $env:GITHUB_WORKSPACE 'artifact\modules'
          New-Item -ItemType Directory -Force -Path $artifactModules | Out-Null
          Copy-Item -LiteralPath $ffmpeg -Destination (Join-Path $artifactModules 'ffmpeg.exe') -Force

      - name: Prepare updater-compatible release package
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $artifact = Join-Path $env:GITHUB_WORKSPACE 'artifact'
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -ne '13.0.6') {
            throw "For the Customgram 0.1.0 migration, create tag v13.0.6 (not v0.1.0). Received: $env:GITHUB_REF_NAME"
          }

          Copy-Item -LiteralPath (Join-Path $artifact 'Customgram.exe') -Destination $dist -Force
          Copy-Item -LiteralPath (Join-Path $artifact 'Updater.exe') -Destination $dist -Force

          $distModules = Join-Path $dist 'modules'
          if (Test-Path -LiteralPath $distModules) { Remove-Item -LiteralPath $distModules -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $distModules | Out-Null
          Copy-Item -Path (Join-Path $artifact 'modules\*') -Destination $distModules -Recurse -Force

          & (Join-Path $dist 'PrepareRelease.ps1') -Version $version

          $releaseDir = Join-Path $dist "release-$version"
          Copy-Item -LiteralPath (Join-Path $releaseDir 'Customgram-Windows.zip') -Destination (Join-Path $env:GITHUB_WORKSPACE 'Customgram-Windows.zip') -Force
          Copy-Item -LiteralPath (Join-Path $releaseDir 'Customgram-Windows.zip.sha256') -Destination (Join-Path $env:GITHUB_WORKSPACE 'Customgram-Windows.zip.sha256') -Force

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Customgram 0.1.0
          generate_release_notes: true
          files: |
            Customgram-Windows.zip
            Customgram-Windows.zip.sha256
